# Linters beyond go vet. Deliberately a short list: every one here has caught
# something real in Go code, and a linter that fires on style nobody agreed to
# gets switched off wholesale, which loses the ones that matter.
version: "2"

linters:
  default: none
  enable:
    - errcheck      # an ignored error is the most common real bug in Go
    - govet
    - ineffassign   # a value computed and thrown away is usually a mistake
    - staticcheck
    - unused
    - misspell
    - bodyclose     # an unclosed response body leaks a connection
    - durationcheck
    - errorlint     # comparing errors with == rather than errors.Is

  # nilerr is deliberately absent. Every one of its findings here was a
  # deliberate pattern rather than a bug: EOF ending a stdio session, a search
  # over an unreadable directory returning no suggestions rather than failing
  # the request, and the self-test recording a failed run as that case's
  # result instead of aborting the corpus. A linter that has to be
  # nolint-commented five times is one that does not fit the codebase.

  settings:
    staticcheck:
      checks:
        - all
        # ST1005 wants short, uncapitalised, unpunctuated error strings. That
        # is right for an error being wrapped by a caller and wrong for this
        # codebase's user-facing ones, which are deliberately several
        # sentences ending in what to do about it — "Widen the date range, or
        # lower --groups." reads worse without the full stop, not better.
        - "-ST1005"
        # QF1001 rewrites !(a && b) into a De Morgan equivalent. In test
        # assertions the negated form is usually the clearer statement of what
        # must hold, and this is a suggestion rather than a correctness rule.
        - "-QF1001"

    misspell:
      # "strat" is short for strategy throughout, not a typo for "start".
      ignore-rules:
        - strat
    errcheck:
      # Printf-family writes to stdout cannot meaningfully fail, and checking
      # every one would bury the errors that matter.
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # Tests may ignore errors freely; a failed setup shows up as a failed test.
      - path: _test\.go
        linters: [errcheck, bodyclose]
