name: CodeQL

# Security scanning. Free on public repositories, and the results land in the
# Security tab rather than in a log nobody opens.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a new query can find something in code that has not
    # changed since the last run.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyse
    # Dependabot's pull requests run with a read-only token, so the upload of
    # results fails with "Resource not accessible by integration" however the
    # permissions block above is written. The scan itself is not skipped: the
    # bump lands on main and is scanned by the push trigger moments later.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
