# Dependency updates.
#
# Go modules are checked monthly rather than weekly: the module graph here is
# deliberately small — a JavaScript interpreter and little else — so weekly
# runs would mostly produce noise, and noise is how update PRs start getting
# ignored.
#
# Actions are pinned by major version in the workflows, so these PRs are
# almost always security or bug fixes worth taking.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
