name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # goja requires this; see go.mod. Kept in one place so the matrix below and
  # the release workflow cannot drift from it.
  GO_VERSION: '1.25'

jobs:
  # ── Linux: the gate. Runs on everything, always. ─────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./examples)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v1 binaries are built with Go 1.24 and refuse a 1.25 module with
          # "the Go language version used to build golangci-lint is lower than
          # the targeted Go version". v2 is built with a newer toolchain.
          version: v2.13.2

      # The whole suite runs against the deterministic synthetic data
      # provider, so CI needs no network access and no API keys.
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "### Coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: go build ./...

  # ── macOS and Windows: NOT on every push (2026-09-02) ────────────────────────
  # on their own — and this repo was 72% of the whole account's. The arithmetic,
  # measured over 38 runs:
  #
  #
  # macOS job is the most expensive habit a repo can have.
  #
  # What justifies moving them: this is a pure-Go CLI with `CGO_ENABLED=0` and no
  # platform-specific packages, so cross-platform breakage is rare — and the
  # RELEASE workflow never tested on macOS or Windows either (it runs
  # `go test ./...` on ubuntu-latest and cross-compiles the rest), so a per-push
  # macOS job was never what gated a shipped binary.
  #
  # What still runs on EVERY push: gofmt, `go mod tidy`, `go vet`,
  # `go test -race`, the full smoke test of the shipped binary, the Python client,
  # the container image, and a cross-compile of all five release targets. A
  # platform-specific break is caught by the nightly, i.e. within a day, instead
  # of within a minute — and `workflow_dispatch` is the button before a release.
  #
  # If this repo ever grows cgo or a platform-specific dependency, put these back
  # on the push trigger: the reasoning above depends on the code being portable.
  test-crossplatform:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  smoke:
    name: Smoke test the shipped binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -o nq ./cmd/pyrite

      # Everything below is what a new user does in their first five minutes,
      # with no API key and no network. If any of it breaks, the project is
      # broken in the way that matters most.
      - name: Help and version
        run: ./nq help && ./nq version
      - name: List bundled examples
        run: ./nq examples
      - name: Run a bundled example
        run: ./nq run --example golden-cross --offline --from 2019-01-02 --to 2023-12-29
      - name: Search a bundled example
        run: ./nq sweep --example sixty-forty --offline --from 2019-01-02 --to 2023-12-29 --top 3
      - name: Walk one forward
        run: ./nq walkforward --example golden-cross --offline --from 2015-01-05 --to 2023-12-29 --train 400 --test 150
      - name: Write a report
        run: |
          ./nq report --example mean-reversion --offline --from 2019-01-02 --to 2023-12-29 --out /tmp/report.md
          test -s /tmp/report.md
          grep -q "How much should you believe this" /tmp/report.md
      # The critique is the reason to use this tool, so the corpus of
      # exits non-zero if one of them gets past it.
      - name: The critic, against strategies built to be caught
        run: ./nq selftest
      - name: Doctor
        run: ./nq doctor

  # (2026-09-02). The rounded-up-minute argument that justifies merging tiny jobs
  # elsewhere does NOT apply here: `smoke` runs ~9 minutes, so there is no
  # Python failure would have read as "smoke failed".
  python:
    name: Python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The client tests start a real server rather than mocking one: a mock
      # would happily agree with a wrong assumption about the API's shape,
      # which is the only failure worth catching here.
      - name: Build the binary the tests drive
        run: go build -o /tmp/pyrite ./cmd/pyrite

      - name: Test
        env:
          PYRITE_BINARY: /tmp/pyrite
        run: python3 -W error::ResourceWarning python/tests/test_client.py

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built but not pushed: a broken Dockerfile should fail the pull
      # request that broke it, not the release three weeks later.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pyrite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must actually run
        run: |
          docker run --rm pyrite:ci version
          docker run --rm pyrite:ci run --example golden-cross --offline \
            --from 2019-01-02 --to 2023-12-29 | grep -q "Total return"

  # ONE job, not five (2026-09-02). This was a 5-way matrix, and each leg spent a
  # whole runner — checkout, setup-go, module download — to run a `go build` that
  #
  # Cross-compiling is exactly the thing that does not need a machine per target:
  # the Go toolchain does all five from this one Linux runner, sharing a single
  # module cache and a single build cache. Keep it a loop. If a target ever needs
  # its own runner (cgo, a platform-specific test), that target earns a job of its
  # own — the other four still do not.
  build-matrix:
    name: Build every release target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # The same five targets release.yml ships. `set -e` is on by default, but
      # the explicit exit keeps a failure attributable to its target.
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null ./cmd/pyrite \
              || { echo "::error::build failed for $target"; exit 1; }
            echo "  ok  $target"
          done
