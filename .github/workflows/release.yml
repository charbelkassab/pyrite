name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # so `git describe` gives a real version

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      # Never ship a binary whose tests did not pass.
      - name: Test
        run: go test ./...

      - name: Build every target
        run: make dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          # A manual dispatch runs from a branch, where ref_name is not a
          # version, so only a real tag can mark itself a prerelease.
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta')) }}
          body: |
            ## Install

            Download the binary for your platform below, or:

            ```bash
            go install github.com/charbelkassab/pyrite/cmd/pyrite@${{ github.ref_name }}
            ```

            Then, with nothing else installed and no API key:

            ```bash
            pyrite run --example golden-cross
            pyrite serve --offline --open
            ```

            Or with Docker:

            ```bash
            docker run --rm -p 8080:8080 \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
              serve --addr 0.0.0.0:8080 --offline
            ```

            Verify a download against `SHA256SUMS`.

  container:
    name: Publish the container image
    runs-on: ubuntu-latest
    # Only for real tags. A dispatch is a dry run of the binaries, and
    # publishing a floating `latest` from a branch is how a registry ends up
    # serving something nobody tagged.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
